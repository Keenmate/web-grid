<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — keyboard fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>keyboard fixture</h1>
	<p>Targeted by <code>e2e/keyboard.spec.ts</code>. 25 rows, navigate mode, click cell-selection,
	row numbers; <code>rangeShortcuts</code> Ctrl+Shift+S (sum) and Ctrl+Shift+X (disabled). Events in
	<code>keyboard-log</code>, shortcut calls in <code>window.__shortcuts</code>.</p>

	<web-grid id="grid" is-editable edit-trigger="navigate" cell-selection-mode="click" is-row-numbers-visible
		style="max-width: 600px; max-height: 1400px;"></web-grid>
	<pre data-testid="keyboard-log"></pre>

	<script type="module">
		import '@keenmate/web-grid'
		import { installEventLog } from './event-log.js'

		/*  25 rows: id = i+1, name = "Row NN", qty = (i+1)*10 (number editor), note = "n<i+1>"
		 *  col: 0=id (read-only) 1=name (text) 2=qty (number) 3=note (text)
		 */
		window.__shortcuts = []
		const grid = document.getElementById('grid')
		grid.idMember = 'id'
		grid.columns = [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '140px', editor: 'text' },
			{ field: 'qty', title: 'Qty', width: '80px', editor: 'number' },
			{ field: 'note', title: 'Note', width: '120px', editor: 'text' }
		]
		grid.items = Array.from({ length: 25 }, (_, i) => ({
			id: i + 1, name: `Row ${String(i + 1).padStart(2, '0')}`, qty: (i + 1) * 10, note: `n${i + 1}`
		}))
		grid.rangeShortcuts = [
			{
				id: 'sum', text: 'Sum', shortcut: 'Ctrl+Shift+S',
				onClick: (d) => window.__shortcuts.push({
					id: 'sum',
					rowIndices: d.rowIndices,
					rows: (d.rows || []).map(r => r.id),
					cells: (d.cells || []).length,
					cellRange: d.cellRange ? [d.cellRange.startRowIndex, d.cellRange.startColIndex, d.cellRange.endRowIndex, d.cellRange.endColIndex] : null
				})
			},
			{ id: 'off', text: 'Off', shortcut: 'Ctrl+Shift+X', getIsDisabledCallback: () => true, onClick: () => window.__shortcuts.push({ id: 'off' }) }
		]
		installEventLog(grid, 'keyboard', ['row-change', 'edit-start', 'action', 'cell-selection-change'])
	</script>
</body>
</html>
