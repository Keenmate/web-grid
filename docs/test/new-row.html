<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — new row fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>new-row fixture</h1>
	<p>Targeted by <code>e2e/new-row.spec.ts</code>. <code>is-new-row-enabled</code>, navigate mode, row numbers;
	2 rows (Alpha, Beta) + the empty row. Events in <code>new-row-log</code>.</p>

	<web-grid id="grid" is-editable edit-trigger="navigate" is-row-numbers-visible is-new-row-enabled style="max-width: 600px;"></web-grid>
	<pre data-testid="new-row-log"></pre>

	<script type="module">
		import '@keenmate/web-grid'
		import { installEventLog } from './event-log.js'

		/* col: 0=id (read-only) 1=name (text) 2=qty (number) */
		const grid = document.getElementById('grid')
		grid.columns = [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '160px', editor: 'text' },
			{ field: 'qty', title: 'Qty', width: '80px', editor: 'number' }
		]
		grid.items = [
			{ id: 1, name: 'Alpha', qty: 10 },
			{ id: 2, name: 'Beta', qty: 20 }
		]
		installEventLog(grid, 'new-row', ['row-change', 'paste-complete'])
	</script>
</body>
</html>
