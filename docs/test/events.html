<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — events fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>events fixture</h1>
	<p>Targeted by <code>e2e/events.spec.ts</code>. Every grid event + its <code>on*</code> twin is
	logged to <code>events-log</code> / <code>window.__events</code>.</p>

	<h2>#grid — flat, navigate mode, click cell-selection, row numbers</h2>
	<web-grid id="grid" enable-editing edit-trigger="navigate" cell-selection-mode="click" show-row-numbers style="max-width: 600px;"></web-grid>

	<h2>#tree — tree (path), all expanded</h2>
	<web-grid id="tree" style="max-width: 600px;"></web-grid>

	<pre data-testid="events-log"></pre>

	<script type="module">
		import '@keenmate/web-grid'
		import { installEventLog } from './event-log.js'

		/*  #grid  row | id | name  | qty      #tree  path  | name
		 *         0   | 1  | Alpha | 10              1     | Root
		 *         1   | 2  | Beta  | 20              1.1   | Child A
		 *         2   | 3  | Gamma | 30              1.1.1 | Leaf A1
		 *                                            1.2   | Child B
		 *                                            2     | Other root
		 */
		const grid = document.getElementById('grid')
		grid.idMember = 'id'
		grid.columns = [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '140px', editor: 'text' },
			{ field: 'qty', title: 'Qty', width: '80px', editor: 'number' }
		]
		grid.items = [
			{ id: 1, name: 'Alpha', qty: 10 },
			{ id: 2, name: 'Beta', qty: 20 },
			{ id: 3, name: 'Gamma', qty: 30 }
		]
		installEventLog(grid, 'events')

		const tree = document.getElementById('tree')
		tree.pathMember = 'path'
		tree.isTreeDataSorted = true
		tree.columns = [{ field: 'name', title: 'Name', width: '220px', isTree: true }]
		tree.items = [
			{ path: '1', name: 'Root' },
			{ path: '1.1', name: 'Child A' },
			{ path: '1.1.1', name: 'Leaf A1' },
			{ path: '1.2', name: 'Child B' },
			{ path: '2', name: 'Other root' }
		]
		installEventLog(tree, 'events')
	</script>
</body>
</html>
