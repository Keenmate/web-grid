<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — edit-trigger fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>edit-trigger fixture</h1>
	<p>Targeted by <code>e2e/edit-trigger.spec.ts</code>. Reload resets all state.</p>

	<div class="fixture">
		<h2>#clickGrid — editTrigger='click', editStartSelection='select-all'</h2>
		<web-grid id="clickGrid" style="max-width: 480px; max-height: 240px;"></web-grid>
	</div>

	<div class="fixture">
		<h2>#dblclickGrid — editTrigger='dblclick'</h2>
		<web-grid id="dblclickGrid" style="max-width: 480px; max-height: 240px;"></web-grid>
	</div>

	<div class="fixture">
		<h2>#navigateGrid — editTrigger='navigate'</h2>
		<web-grid id="navigateGrid" style="max-width: 480px; max-height: 240px;"></web-grid>
	</div>

	<script type="module">
		import '@keenmate/web-grid'

		/*
		 * Three identical grids, one per editTrigger mode. Each is a 5-row grid
		 * with columns id (read-only), name (text), score (number).
		 *
		 *  row | id | name   | score
		 *  ----+----+--------+------
		 *   0  |  1 | Alice  |  10
		 *   1  |  2 | Bob    |  20
		 *   2  |  3 | Carol  |  30
		 *   3  |  4 | David  |  40
		 *   4  |  5 | Eve    |  50
		 *
		 * Behaviour the spec exercises:
		 *  #clickGrid    — editTrigger='click': a single click opens the editor.
		 *                  editStartSelection='select-all' so the editor mounts with
		 *                  the whole value selected.
		 *  #dblclickGrid — editTrigger='dblclick': a single click only focuses the
		 *                  cell; a double-click opens the editor.
		 *  #navigateGrid — editTrigger='navigate': a single click only focuses; the
		 *                  editor opens on F2 (or on typing a character).
		 */
		const seed = () => [
			{ id: 1, name: 'Alice', score: 10 },
			{ id: 2, name: 'Bob', score: 20 },
			{ id: 3, name: 'Carol', score: 30 },
			{ id: 4, name: 'David', score: 40 },
			{ id: 5, name: 'Eve', score: 50 }
		]

		const columns = () => [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '160px', editor: 'text' },
			{ field: 'score', title: 'Score', width: '90px', editor: 'number' }
		]

		const clickGrid = document.getElementById('clickGrid')
		clickGrid.items = seed()
		clickGrid.columns = columns()
		clickGrid.isEditable = true
		clickGrid.editTrigger = 'click'
		clickGrid.editStartSelection = 'select-all'

		const dblclickGrid = document.getElementById('dblclickGrid')
		dblclickGrid.items = seed()
		dblclickGrid.columns = columns()
		dblclickGrid.isEditable = true
		dblclickGrid.editTrigger = 'dblclick'

		const navigateGrid = document.getElementById('navigateGrid')
		navigateGrid.items = seed()
		navigateGrid.columns = columns()
		navigateGrid.isEditable = true
		navigateGrid.editTrigger = 'navigate'
	</script>
</body>
</html>
