<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — row API fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>row-api fixture</h1>
	<p>Targeted by <code>e2e/row-api.spec.ts</code>. Row identity (<code>idMember</code>, default <code>'id'</code> /
	<code>getIdCallback</code>), <code>getRowById</code> / <code>getRowIndex</code> / <code>updateRowById</code> / <code>replaceRowById</code>,
	<code>focusCell</code> / <code>startEditing</code>. Rows carry a <code>code</code> field ("A-1") for the callback id.</p>

	<web-grid id="grid" editable edit-trigger="navigate" style="max-width: 600px;"></web-grid>
	<pre data-testid="row-api-log"></pre>

	<script type="module">
		import '@keenmate/web-grid'
		import { installEventLog } from './event-log.js'

		/* col: 0=id (read-only) 1=name (text) 2=qty (number) 3=code (read-only) */
		const grid = document.getElementById('grid')
		grid.columns = [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '140px', editor: 'text' },
			{ field: 'qty', title: 'Qty', width: '80px', editor: 'number' },
			{ field: 'code', title: 'Code', width: '80px', isEditable: false }
		]
		grid.items = [
			{ id: 1, name: 'Alpha', qty: 10, code: 'A-1' },
			{ id: 2, name: 'Beta', qty: 20, code: 'B-2' },
			{ id: 3, name: 'Gamma', qty: 30, code: 'G-3' }
		]
		installEventLog(grid, 'row-api', ['cell-edit-start', 'focus-change'])
	</script>
</body>
</html>
