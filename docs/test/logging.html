<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — logging fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>logging fixture</h1>
	<p>Targeted by <code>e2e/logging.spec.ts</code>. A small sortable, editable grid; the spec drives
	<code>window.components['web-grid'].logging</code> and watches the console.</p>

	<web-grid id="grid" is-editable edit-trigger="navigate" sort-mode="single" style="max-width: 500px;"></web-grid>

	<script type="module">
		import '@keenmate/web-grid'

		const grid = document.getElementById('grid')
		grid.idMember = 'id'
		grid.columns = [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '140px', editor: 'text' }
		]
		grid.items = [{ id: 2, name: 'Beta' }, { id: 1, name: 'Alpha' }]
	</script>
</body>
</html>
