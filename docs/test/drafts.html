<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — drafts fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>drafts fixture</h1>
	<p>Targeted by <code>e2e/drafts.spec.ts</code>. Navigate-mode editable grid with row numbers;
	edits go to per-row drafts. Events logged to <code>drafts-log</code>.</p>

	<web-grid id="grid" is-editable edit-trigger="navigate" is-row-numbers-visible sort-mode="single" style="max-width: 600px;"></web-grid>
	<pre data-testid="drafts-log"></pre>

	<script type="module">
		import '@keenmate/web-grid'
		import { installEventLog } from './event-log.js'

		/*
		 *  row | id | name   | qty (number)
		 *  0   | 1  | Alpha  | 10
		 *  1   | 2  | Beta   | 20
		 *  2   | 3  | Gamma  | 30
		 *  3   | 4  | Delta  | 40
		 */
		window.seed = () => [
			{ id: 1, name: 'Alpha', qty: 10 },
			{ id: 2, name: 'Beta', qty: 20 },
			{ id: 3, name: 'Gamma', qty: 30 },
			{ id: 4, name: 'Delta', qty: 40 }
		]
		const grid = document.getElementById('grid')
		grid.idMember = 'id'
		grid.columns = [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '160px', editor: 'text', isSortable: true },
			{ field: 'qty', title: 'Qty', width: '80px', editor: 'number' }
		]
		grid.items = window.seed()
		installEventLog(grid, 'drafts', ['row-change', 'edit-start', 'edit-cancel'])
	</script>
</body>
</html>
