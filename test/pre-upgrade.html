	<h1>pre-upgrade fixture</h1>
	<p>Targeted by <code>e2e/pre-upgrade.spec.ts</code>. A classic script assigns <code>columns</code>,

	<web-grid id="grid" enable-paging style="max-width: 600px;"></web-grid>

	<script>
		const el = document.getElementById('grid')

		el.items = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, name: 'Early ' + (i + 1) }))
		el.pageSize = 5
	</script>

		import '@keenmate/web-grid'
	</script>
