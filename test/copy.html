<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — copy fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>copy fixture</h1>
	<p>Targeted by <code>e2e/copy.spec.ts</code> (runs with clipboard permissions). Navigate mode,
	row numbers, click cell-selection; the price column has a <code>getCopyValueCallback</code>.</p>

	<web-grid id="grid" enable-editing edit-trigger="navigate" show-row-numbers cell-selection-mode="click" style="max-width: 600px;"></web-grid>
	<web-grid id="shown" enable-editing edit-trigger="navigate" show-row-numbers cell-selection-mode="click" open-dropdown-on-focus="false" style="max-width: 600px;"></web-grid>

	<script type="module">
		import '@keenmate/web-grid'

		/*
		 *  col:  0=id  1=name   2=price (getCopyValueCallback → "12.50 EUR")  3=note
		 *  row 0 | 1 | Apple  | 12.5 | fresh
		 *  row 1 | 2 | Banana | 3    | (null)
		 *  row 2 | 3 | Cherry | 7.25 | ripe
		 */
		const grid = document.getElementById('grid')
		grid.columns = [
			{ field: 'id', title: 'ID', width: '60px', isEditable: false },
			{ field: 'name', title: 'Name', width: '140px', editor: 'text' },
			{ field: 'price', title: 'Price', width: '100px', editor: 'number',
				getCopyValueCallback: ({ value }) => `${Number(value).toFixed(2)} EUR` },
			{ field: 'note', title: 'Note', width: '120px', editor: 'text' }
		]
		grid.items = [
			{ id: 1, name: 'Apple', price: 12.5, note: 'fresh' },
			{ id: 2, name: 'Banana', price: 3, note: null },
			{ id: 3, name: 'Cherry', price: 7.25, note: 'ripe' }
		]

		/*
		 * #shown — copy = what the cell SHOWS for date / dropdown columns (Excel)
		 *  col:  0=id  1=status (select: a→Active, p→Paused)  2=due (date, DD.MM.YYYY)
		 *        3=size (combobox, getCopyValueCallback → "size:<value>")  4=when (date, getDisplayValueCallback → "Q<n>")
		 *        5=tier (select g→Gold / s→Silver, getDisplayValueCallback → "★ <label>")
		 *        6=qty (number, getDisplayValueCallback → "<n> pcs")
		 *  row 0 | 1 | a | 2026-03-05 | s | 2026-02-10 | g | 1500
		 *  row 1 | 2 | p | (null)     | l | 2026-11-01 | s | 2
		 */
		const shown = document.getElementById('shown')
		const sizes = [{ value: 's', label: 'Small' }, { value: 'l', label: 'Large' }]
		const tiers = [{ value: 'g', label: 'Gold' }, { value: 's', label: 'Silver' }]
		shown.columns = [
			{ field: 'id', title: 'ID', width: '50px', isEditable: false },
			{ field: 'status', title: 'Status', width: '110px', editor: 'select',
				editorOptions: { options: [{ value: 'a', label: 'Active' }, { value: 'p', label: 'Paused' }] } },
			{ field: 'due', title: 'Due', width: '120px', editor: 'date', editorOptions: { dateFormat: 'DD.MM.YYYY' } },
			{ field: 'size', title: 'Size', width: '100px', editor: 'combobox', editorOptions: { options: sizes },
				getCopyValueCallback: ({ value }) => `size:${value}` },
			{ field: 'when', title: 'When', width: '90px', editor: 'date',
				getDisplayValueCallback: ({ value }) => `Q${Math.floor(new Date(value).getMonth() / 3) + 1}` },
			{ field: 'tier', title: 'Tier', width: '100px', editor: 'select', editorOptions: { options: tiers },
				getDisplayValueCallback: ({ value }) => `★ ${tiers.find(t => t.value === value)?.label ?? value}` },
			{ field: 'qty', title: 'Qty', width: '90px', editor: 'number',
				getDisplayValueCallback: ({ value }) => `${value} pcs` }
		]
		shown.items = [
			{ id: 1, status: 'a', due: '2026-03-05', size: 's', when: '2026-02-10', tier: 'g', qty: 1500 },
			{ id: 2, status: 'p', due: null, size: 'l', when: '2026-11-01', tier: 's', qty: 2 }
		]
	</script>
</body>
</html>
