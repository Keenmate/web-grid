<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test — tooltip fixture</title>
	<link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
	<h1>tooltip fixture</h1>
	<p>Targeted by <code>e2e/tooltip.spec.ts</code>. <code>tooltip-show-delay="0"</code> /
	<code>tooltip-hide-delay="0"</code> so the spec controls timing; it raises them to test the delays.</p>

	<web-grid id="grid" tooltip-show-delay="0" tooltip-hide-delay="0" enable-editing edit-trigger="navigate" style="max-width: 700px;"></web-grid>

	<web-grid id="sized" tooltip-show-delay="0" tooltip-hide-delay="0" style="max-width: 700px; margin-top: 2rem;"></web-grid>

	<script type="module">
		import '@keenmate/web-grid'

		/*
		 * col 0 name  — getTooltipCallback → "Name: <raw value>" (plain text)
		 * col 1 note  — tooltipMember 'hint' (row 1 has no hint → no tooltip)
		 * col 2 rich  — getTooltipCallback + isTooltipHtml → "<b>bold</b> <value>" (no quoted attributes — NOTES.md #21)
		 * col 3 code  — headerInfo "Unique code"; validateCallback (must be 3 letters);
		 *               column getValidationTooltipCallback → "<i>Fix: error</i>"
		 * col 4 qty   — validateCallback (>= 0); no column tooltip callback → grid-level
		 *               getValidationTooltipCallback is set by the spec when needed
		 * col 5 state — getTooltipCallback reads page state (window.tooltipState, changed by
		 *               the spec without a re-render) — proves it's resolved when the tooltip opens
		 *
		 * #sized — one column, tooltipMember 'tip' (row 0 short "OK", row 1 long text);
		 *          the spec sets --wg-tooltip-width / -min-width / -max-width on it
		 */
		window.tooltipState = 'before'
		const grid = document.getElementById('grid')
		grid.idMember = 'id'
		grid.columns = [
			{ field: 'name', title: 'Name', width: '120px', getTooltipCallback: (ctx) => `Name: ${ctx.value}` },
			{ field: 'note', title: 'Note', width: '100px', tooltipMember: 'hint' },
			{ field: 'rich', title: 'Rich', width: '100px', isTooltipHtml: true, getTooltipCallback: (ctx) => `<b>bold</b> ${ctx.value}` },
			{ field: 'code', title: 'Code', width: '100px', editor: 'text', headerInfo: 'Unique code',
				validateCallback: ({ value }) => /^[A-Z]{3}$/.test(String(value)) ? null : 'Code must be 3 capital letters',
				getValidationTooltipCallback: (ctx) => `<i>Fix: ${ctx.error}</i>` },
			{ field: 'qty', title: 'Qty', width: '80px', editor: 'number',
				validateCallback: ({ value }) => Number(value) >= 0 ? null : 'Must not be negative' },
			{ field: 'state', title: 'State', width: '80px',
				getTooltipCallback: (ctx) => `${ctx.value}: ${window.tooltipState}` }
		]
		grid.items = [
			{ id: 1, name: 'Alpha', note: 'n1', hint: 'Hint one', rich: 'r1', code: 'AAA', qty: 1, state: 's1' },
			{ id: 2, name: 'Beta', note: 'n2', hint: null, rich: 'r2', code: 'BBB', qty: 2, state: 's2' }
		]

		const sized = document.getElementById('sized')
		sized.idMember = 'id'
		sized.columns = [{ field: 'label', title: 'Label', width: '200px', tooltipMember: 'tip' }]
		sized.items = [
			{ id: 1, label: 'short', tip: 'OK' },
			{ id: 2, label: 'long', tip: 'A long tooltip text that keeps going well past any sensible single line width, so the max-width cap has to wrap it onto several lines.' }
		]
	</script>
</body>
</html>
