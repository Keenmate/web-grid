# GENERATED by `kmwc sync` from @keenmate/web-components-devkit — do not edit.
# Change package.json#kmwc (or the devkit template) and re-run `npx kmwc sync`.
#
# Static server for the web-grid examples site. 100% static (HTML + bundled
# assets + demo data), no backend — so the vulnerability scanners that probe the
# public host (leakix/l9scan et al. hitting /api/gql, info.php, .git, .env, …)
# have nothing to exploit. Drop that traffic with 444 (close, no response).

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # 1. Known vulnerability scanners by User-Agent → close immediately.
    if ($http_user_agent ~* "(l9scan|leakix|nikto|sqlmap|nmap|masscan|zgrab|censys|nuclei|httpx|semrush|petalbot)") {
        return 444;
    }

    # 2. Exploit-probe file extensions this static site never serves.
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|env|ini|sh|bak|old|sql)$ {
        access_log off;
        return 444;
    }

    # 3. Exploit-probe paths (app frameworks, VCS/CI metadata, dotfiles).
    location ~* /(\.git|\.svn|\.hg|\.env|wp-admin|wp-login|wp-content|wp-includes|xmlrpc|telescope|actuator|vendor|META-INF|WEB-INF|phpmyadmin|pma|adminer|owa)(/|$) {
        access_log off;
        return 444;
    }

    # 4. Vite-bundled assets carry a content hash in their name — cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 5. Pages and un-hashed files (demo data, docs): always revalidate (cheap
    #    304 via ETag), so a redeploy is visible immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
